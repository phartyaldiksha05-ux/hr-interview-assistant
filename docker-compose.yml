services:
  db:
    image: postgres:16-alpine
    container_name: hr_postgres
    environment:
      POSTGRES_USER: hr_user
      POSTGRES_PASSWORD: hr_password
      POSTGRES_DB: hr_assistant
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hr_user -d hr_assistant"]
      interval: 5s
      retries: 5
volumes:
  pg_data:
